<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NaverFoto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            background: #eeeeee;
            font-family: Arial, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;

            padding:
                max(5px, env(safe-area-inset-top))
                8px
                max(8px, env(safe-area-inset-bottom));

            gap: 5px;
        }

        h1 {
            margin: 0;
            font-size: 21px;
            line-height: 25px;
            text-align: center;
        }

        #inputRow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .inputGroup {
            min-width: 0;
        }

        label {
            display: block;
            margin: 0 0 2px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 43px;
            padding: 5px 9px;
            border: 2px solid #555555;
            border-radius: 7px;
            background: white;
            font-size: 18px;
            font-weight: bold;
        }

        #project,
        #point {
            text-transform: uppercase;
        }

        #depthEditor {
            display: grid;
            grid-template-columns: 1fr 26px 1fr;
            align-items: end;
            gap: 4px;
            padding: 5px;
            border: 2px solid #1769aa;
            border-radius: 8px;
            background: #ffffff;
        }

        #depthSeparator {
            padding-bottom: 10px;
            font-size: 21px;
            font-weight: bold;
            text-align: center;
        }

        .depthInput {
            height: 42px;
            border-color: #1769aa;
            font-size: 20px;
            text-align: center;
        }

        #depthPreview {
            min-height: 25px;
            margin: 0;
            color: #123f66;
            font-size: 19px;
            font-weight: bold;
            line-height: 25px;
            text-align: center;
        }

        #cameraArea {
            position: relative;
            width: 100%;
            min-height: 310px;
            flex: 1 1 430px;
            overflow: hidden;
            border-radius: 9px;
            background: black;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 310px;
            background: black;
            object-fit: contain;
        }

        #cameraStatus {
            position: absolute;
            left: 6px;
            bottom: 6px;
            max-width: calc(100% - 12px);
            padding: 3px 7px;
            border-radius: 4px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            font-size: 12px;
            pointer-events: none;
        }

        button {
            min-height: 43px;
            padding: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #capture {
            width: 100%;
            min-height: 50px;
            color: white;
            background: #1769aa;
            font-size: 21px;
        }

        #depthButtons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        #back {
            color: white;
            background: #555555;
        }

        #next {
            color: white;
            background: #2e7d32;
        }

        #reset {
            width: 100%;
            min-height: 40px;
            color: #111111;
            background: #d0d0d0;
            font-size: 15px;
        }

        #status {
            min-height: 18px;
            overflow: hidden;
            color: #333333;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #status.error {
            color: #b00020;
            font-weight: bold;
        }

        #canvas {
            display: none;
        }

        @media (max-height: 800px) {
            #app {
                min-height: 830px;
            }

            #cameraArea,
            video {
                min-height: 310px;
            }
        }

        @media (max-width: 370px) {
            input {
                font-size: 16px;
            }

            #depthButtons button {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main id="app">

        <h1>NaverFoto</h1>

        <section id="inputRow">

            <div class="inputGroup">
                <label for="project">Prosjektnummer</label>

                <input
                    id="project"
                    type="text"
                    placeholder="F.eks. 12345"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                >
            </div>

            <div class="inputGroup">
                <label for="point">Borepunkt</label>

                <input
                    id="point"
                    type="text"
                    value="SK1"
                    placeholder="F.eks. SK1"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                >
            </div>

        </section>

        <section id="depthEditor">

            <div class="inputGroup">
                <label for="fromDepth">Fra dybde (m)</label>

                <input
                    id="fromDepth"
                    class="depthInput"
                    type="text"
                    inputmode="decimal"
                    value="0"
                    placeholder="0"
                    autocomplete="off"
                >
            </div>

            <div id="depthSeparator">–</div>

            <div class="inputGroup">
                <label for="toDepth">Til dybde (m)</label>

                <input
                    id="toDepth"
                    class="depthInput"
                    type="text"
                    inputmode="decimal"
                    value="1"
                    placeholder="1"
                    autocomplete="off"
                >
            </div>

        </section>

        <div id="depthPreview">0–1 m</div>

        <section id="cameraArea">

            <video
                id="camera"
                autoplay
                muted
                playsinline
            ></video>

            <div id="cameraStatus">
                Starter bakkameraet …
            </div>

        </section>

        <button
            id="capture"
            type="button"
            disabled
        >
            TA BILDE
        </button>

        <section id="depthButtons">

            <button id="back" type="button">
                ◀ FORRIGE
            </button>

            <button id="next" type="button">
                NESTE ▶
            </button>

        </section>

        <button id="reset" type="button">
            NULLSTILL TIL 0–1 m
        </button>

        <div
            id="status"
            role="status"
            aria-live="polite"
        >
            Gjør klar kameraet …
        </div>

        <canvas id="canvas"></canvas>

    </main>

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            async function () {
                "use strict";

                const NORMAL_STEP = 1;

                let cameraStream = null;
                let isSaving = false;

                const projectInput =
                    document.getElementById("project");

                const pointInput =
                    document.getElementById("point");

                const fromDepthInput =
                    document.getElementById("fromDepth");

                const toDepthInput =
                    document.getElementById("toDepth");

                const depthPreview =
                    document.getElementById("depthPreview");

                const video =
                    document.getElementById("camera");

                const canvas =
                    document.getElementById("canvas");

                const captureButton =
                    document.getElementById("capture");

                const backButton =
                    document.getElementById("back");

                const nextButton =
                    document.getElementById("next");

                const resetButton =
                    document.getElementById("reset");

                const status =
                    document.getElementById("status");

                const cameraStatus =
                    document.getElementById("cameraStatus");

                function setStatus(message, isError = false) {
                    status.textContent = message;
                    status.classList.toggle(
                        "error",
                        isError
                    );
                }

                /*
                 * Godtar både 4,35 og 4.35.
                 */
                function parseDepth(value) {
                    const cleaned = String(value)
                        .trim()
                        .replace(",", ".");

                    if (cleaned === "") {
                        return null;
                    }

                    const number = Number(cleaned);

                    if (
                        !Number.isFinite(number) ||
                        number < 0
                    ) {
                        return null;
                    }

                    return Math.round(number * 100) / 100;
                }

                /*
                 * Viser norske desimaler:
                 * 4.35 blir 4,35.
                 */
                function formatDepth(value) {
                    return new Intl.NumberFormat(
                        "no-NO",
                        {
                            minimumFractionDigits: 0,
                            maximumFractionDigits: 2
                        }
                    ).format(value);
                }

                function getDepths() {
                    const fromDepth =
                        parseDepth(fromDepthInput.value);

                    const toDepth =
                        parseDepth(toDepthInput.value);

                    if (
                        fromDepth === null ||
                        toDepth === null
                    ) {
                        return {
                            valid: false,
                            message:
                                "Skriv inn gyldige dybder."
                        };
                    }

                    if (toDepth <= fromDepth) {
                        return {
                            valid: false,
                            message:
                                "Til-dybden må være større enn fra-dybden."
                        };
                    }

                    return {
                        valid: true,
                        from: fromDepth,
                        to: toDepth
                    };
                }

                function getDepthText(from, to) {
                    return (
                        formatDepth(from) +
                        "–" +
                        formatDepth(to) +
                        " m"
                    );
                }

                function updateDepthPreview() {
                    const depths = getDepths();

                    if (!depths.valid) {
                        depthPreview.textContent =
                            "Kontroller dybden";

                        depthPreview.style.color =
                            "#b00020";

                        return;
                    }

                    depthPreview.textContent =
                        getDepthText(
                            depths.from,
                            depths.to
                        );

                    depthPreview.style.color =
                        "#123f66";
                }

                function setDepths(from, to) {
                    fromDepthInput.value =
                        formatDepth(from);

                    toDepthInput.value =
                        formatDepth(to);

                    updateDepthPreview();
                    saveValues();
                }

                function getDateText() {
                    const now = new Date();

                    const day =
                        String(now.getDate())
                            .padStart(2, "0");

                    const month =
                        String(now.getMonth() + 1)
                            .padStart(2, "0");

                    return (
                        day +
                        "." +
                        month +
                        "." +
                        now.getFullYear()
                    );
                }

                function getFileDate() {
                    return getDateText()
                        .replaceAll(".", "-");
                }

                function safeFilePart(
                    value,
                    fallback
                ) {
                    const cleaned = value
                        .trim()
                        .toUpperCase()
                        .replace(
                            /[^A-ZÆØÅ0-9_-]/gi,
                            "_"
                        )
                        .replace(/_+/g, "_");

                    return cleaned || fallback;
                }

                /*
                 * Dybde til filnavn.
                 * 4,35 blir 4-35.
                 */
                function fileDepth(value) {
                    return formatDepth(value)
                        .replace(",", "-")
                        .replace(/\s/g, "");
                }

                function saveValues() {
                    try {
                        localStorage.setItem(
                            "naverfotoProject",
                            projectInput.value
                        );

                        localStorage.setItem(
                            "naverfotoPoint",
                            pointInput.value
                        );

                        localStorage.setItem(
                            "naverfotoFromDepth",
                            fromDepthInput.value
                        );

                        localStorage.setItem(
                            "naverfotoToDepth",
                            toDepthInput.value
                        );
                    } catch (error) {
                        console.warn(
                            "Kunne ikke lagre verdiene.",
                            error
                        );
                    }
                }

                function loadValues() {
                    try {
                        const project =
                            localStorage.getItem(
                                "naverfotoProject"
                            );

                        const point =
                            localStorage.getItem(
                                "naverfotoPoint"
                            );

                        const fromDepth =
                            localStorage.getItem(
                                "naverfotoFromDepth"
                            );

                        const toDepth =
                            localStorage.getItem(
                                "naverfotoToDepth"
                            );

                        if (project) {
                            projectInput.value = project;
                        }

                        if (point) {
                            pointInput.value = point;
                        }

                        if (fromDepth !== null) {
                            fromDepthInput.value =
                                fromDepth;
                        }

                        if (toDepth !== null) {
                            toDepthInput.value =
                                toDepth;
                        }
                    } catch (error) {
                        console.warn(
                            "Kunne ikke hente lagrede verdier.",
                            error
                        );
                    }
                }

                function drawOutlinedText(
                    context,
                    text,
                    x,
                    y,
                    outlineWidth
                ) {
                    context.lineWidth = outlineWidth;
                    context.lineJoin = "round";
                    context.miterLimit = 2;
                    context.strokeStyle =
                        "rgba(0, 0, 0, 0.95)";
                    context.fillStyle = "#ffffff";

                    context.strokeText(text, x, y);
                    context.fillText(text, x, y);
                }

                async function openCamera(
                    constraints
                ) {
                    return navigator.mediaDevices
                        .getUserMedia({
                            video: constraints,
                            audio: false
                        });
                }

                function stopCamera() {
                    if (!cameraStream) {
                        return;
                    }

                    cameraStream
                        .getTracks()
                        .forEach(function (track) {
                            track.stop();
                        });

                    cameraStream = null;
                }

                async function startBackCamera() {
                    if (
                        !navigator.mediaDevices ||
                        !navigator.mediaDevices.getUserMedia
                    ) {
                        cameraStatus.textContent =
                            "Nettleseren støtter ikke kamera.";

                        setStatus(
                            "Åpne siden i Chrome via HTTPS.",
                            true
                        );

                        return;
                    }

                    stopCamera();

                    try {
                        cameraStream =
                            await openCamera({
                                facingMode: {
                                    exact: "environment"
                                },
                                width: {
                                    ideal: 1920
                                },
                                height: {
                                    ideal: 1080
                                }
                            });
                    } catch (firstError) {
                        try {
                            cameraStream =
                                await openCamera({
                                    facingMode: {
                                        ideal: "environment"
                                    },
                                    width: {
                                        ideal: 1920
                                    },
                                    height: {
                                        ideal: 1080
                                    }
                                });
                        } catch (cameraError) {
                            console.error(
                                cameraError
                            );

                            cameraStatus.textContent =
                                "Kameraet kunne ikke åpnes.";

                            setStatus(
                                "Kontroller kameratillatelsen.",
                                true
                            );

                            return;
                        }
                    }

                    video.srcObject = cameraStream;
                    await video.play();

                    cameraStatus.textContent =
                        "Bakkamera klart";

                    captureButton.disabled = false;

                    setStatus(
                        "Klar til å ta bilde."
                    );

                    setTimeout(
                        function () {
                            cameraStatus.style.display =
                                "none";
                        },
                        1800
                    );
                }

                function takePhoto() {
                    if (isSaving) {
                        return;
                    }

                    const width = video.videoWidth;
                    const height = video.videoHeight;

                    if (!width || !height) {
                        alert(
                            "Kameraet er ikke klart ennå."
                        );

                        return;
                    }

                    const projectNumber =
                        projectInput.value
                            .trim()
                            .toUpperCase();

                    const borepunkt =
                        pointInput.value
                            .trim()
                            .toUpperCase();

                    if (!projectNumber) {
                        alert(
                            "Skriv inn prosjektnummer."
                        );

                        projectInput.focus();
                        return;
                    }

                    if (!borepunkt) {
                        alert(
                            "Skriv inn borepunkt."
                        );

                        pointInput.focus();
                        return;
                    }

                    const depths = getDepths();

                    if (!depths.valid) {
                        alert(depths.message);
                        toDepthInput.focus();
                        return;
                    }

                    const fromDepth = depths.from;
                    const toDepth = depths.to;

                    const lines = [
                        "Prosjekt: " + projectNumber,
                        "Borepunkt: " + borepunkt,
                        "Dybde: " +
                            getDepthText(
                                fromDepth,
                                toDepth
                            ),
                        getDateText()
                    ];

                    canvas.width = width;
                    canvas.height = height;

                    const context =
                        canvas.getContext("2d");

                    context.drawImage(
                        video,
                        0,
                        0,
                        width,
                        height
                    );

                    const fontSize = Math.max(
                        34,
                        Math.round(width * 0.038)
                    );

                    const leftMargin = Math.max(
                        22,
                        Math.round(width * 0.025)
                    );

                    const topMargin = Math.max(
                        28,
                        Math.round(height * 0.04)
                    );

                    const lineSpacing =
                        Math.round(fontSize * 1.32);

                    const outlineWidth = Math.max(
                        4,
                        Math.round(fontSize * 0.13)
                    );

                    context.font =
                        "bold " +
                        fontSize +
                        "px Arial, sans-serif";

                    context.textAlign = "left";
                    context.textBaseline = "top";

                    lines.forEach(
                        function (line, index) {
                            drawOutlinedText(
                                context,
                                line,
                                leftMargin,
                                topMargin +
                                    lineSpacing * index,
                                outlineWidth
                            );
                        }
                    );

                    isSaving = true;
                    captureButton.disabled = true;
                    captureButton.textContent =
                        "LAGRER …";

                    canvas.toBlob(
                        function (blob) {
                            if (!blob) {
                                isSaving = false;
                                captureButton.disabled =
                                    false;
                                captureButton.textContent =
                                    "TA BILDE";

                                setStatus(
                                    "Bildet kunne ikke lagres.",
                                    true
                                );

                                return;
                            }

                            const fileName =
                                safeFilePart(
                                    projectNumber,
                                    "PROSJEKT"
                                ) +
                                "_" +
                                safeFilePart(
                                    borepunkt,
                                    "BOREPUNKT"
                                ) +
                                "_" +
                                fileDepth(fromDepth) +
                                "-" +
                                fileDepth(toDepth) +
                                "m_" +
                                getFileDate() +
                                ".jpg";

                            const imageUrl =
                                URL.createObjectURL(blob);

                            const link =
                                document.createElement("a");

                            link.href = imageUrl;
                            link.download = fileName;

                            document.body.appendChild(link);
                            link.click();
                            link.remove();

                            setTimeout(
                                function () {
                                    URL.revokeObjectURL(
                                        imageUrl
                                    );
                                },
                                2000
                            );

                            /*
                             * Neste prøve starter på
                             * sluttdybden til forrige prøve.
                             *
                             * Eksempel:
                             * Siste prøve 4–4,35 m
                             * Neste forslag 4,35–5,35 m
                             */
                            setDepths(
                                toDepth,
                                toDepth + NORMAL_STEP
                            );

                            isSaving = false;
                            captureButton.disabled = false;
                            captureButton.textContent =
                                "TA BILDE";

                            setStatus(
                                "Lagret: " + fileName
                            );
                        },
                        "image/jpeg",
                        0.95
                    );
                }

                captureButton.addEventListener(
                    "click",
                    takePhoto
                );

                backButton.addEventListener(
                    "click",
                    function () {
                        const depths = getDepths();

                        if (!depths.valid) {
                            setDepths(0, 1);
                            return;
                        }

                        const newFrom = Math.max(
                            0,
                            depths.from - NORMAL_STEP
                        );

                        setDepths(
                            newFrom,
                            newFrom + NORMAL_STEP
                        );

                        setStatus(
                            "Valgt dybde: " +
                            getDepthText(
                                newFrom,
                                newFrom + NORMAL_STEP
                            )
                        );
                    }
                );

                nextButton.addEventListener(
                    "click",
                    function () {
                        const depths = getDepths();

                        if (!depths.valid) {
                            alert(depths.message);
                            return;
                        }

                        /*
                         * Hopper videre fra gjeldende
                         * sluttdybde.
                         */
                        const newFrom = depths.to;
                        const newTo =
                            newFrom + NORMAL_STEP;

                        setDepths(
                            newFrom,
                            newTo
                        );

                        setStatus(
                            "Valgt dybde: " +
                            getDepthText(
                                newFrom,
                                newTo
                            )
                        );
                    }
                );

                resetButton.addEventListener(
                    "click",
                    function () {
                        setDepths(0, 1);

                        setStatus(
                            "Dybden er nullstilt til 0–1 m."
                        );
                    }
                );

                projectInput.addEventListener(
                    "input",
                    function () {
                        projectInput.value =
                            projectInput.value
                                .toUpperCase();

                        saveValues();
                    }
                );

                pointInput.addEventListener(
                    "input",
                    function () {
                        pointInput.value =
                            pointInput.value
                                .toUpperCase();

                        saveValues();
                    }
                );

                fromDepthInput.addEventListener(
                    "input",
                    function () {
                        updateDepthPreview();
                        saveValues();
                    }
                );

                toDepthInput.addEventListener(
                    "input",
                    function () {
                        updateDepthPreview();
                        saveValues();
                    }
                );

                /*
                 * Formaterer dybden når du går ut
                 * av feltet.
                 */
                fromDepthInput.addEventListener(
                    "blur",
                    function () {
                        const value =
                            parseDepth(
                                fromDepthInput.value
                            );

                        if (value !== null) {
                            fromDepthInput.value =
                                formatDepth(value);
                        }

                        updateDepthPreview();
                        saveValues();
                    }
                );

                toDepthInput.addEventListener(
                    "blur",
                    function () {
                        const value =
                            parseDepth(
                                toDepthInput.value
                            );

                        if (value !== null) {
                            toDepthInput.value =
                                formatDepth(value);
                        }

                        updateDepthPreview();
                        saveValues();
                    }
                );

                window.addEventListener(
                    "beforeunload",
                    stopCamera
                );

                loadValues();
                updateDepthPreview();
                await startBackCamera();
            }
        );
    </script>

</body>
</html>
