<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>NaverFoto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            height: 100dvh;
            min-height: 100vh;
            margin: 0 auto;
            padding:
                max(6px, env(safe-area-inset-top))
                10px
                max(6px, env(safe-area-inset-bottom));
            gap: 6px;
        }

        h1 {
            flex: 0 0 auto;
            margin: 0;
            text-align: center;
            font-size: clamp(21px, 3.2vh, 28px);
            line-height: 1.1;
        }

        #topRow {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: end;
            flex: 0 0 auto;
            gap: 8px;
        }

        #pointArea {
            min-width: 0;
        }

        label {
            display: block;
            margin: 0 0 2px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: clamp(42px, 6vh, 52px);
            padding: 6px 10px;
            border: 2px solid #666666;
            border-radius: 7px;
            background: white;
            font-size: clamp(19px, 2.8vh, 24px);
            font-weight: bold;
            text-transform: uppercase;
        }

        #depthLabel {
            min-width: 100px;
            height: clamp(42px, 6vh, 52px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border: 2px solid #1769aa;
            border-radius: 7px;
            background: white;
            font-size: clamp(20px, 3vh, 27px);
            font-weight: bold;
            white-space: nowrap;
        }

        #cameraArea {
            position: relative;
            flex: 1 1 auto;
            min-height: 120px;
            overflow: hidden;
            border-radius: 10px;
            background: black;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            background: black;
            object-fit: contain;
        }

        #cameraStatus {
            position: absolute;
            left: 6px;
            bottom: 6px;
            max-width: calc(100% - 12px);
            padding: 3px 7px;
            border-radius: 5px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            font-size: 12px;
            pointer-events: none;
        }

        button {
            min-height: clamp(43px, 6.2vh, 56px);
            padding: 6px;
            border: none;
            border-radius: 8px;
            font-size: clamp(16px, 2.4vh, 21px);
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
