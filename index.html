<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NaverFoto</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    background: #f2f2f2;
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    font-size: 20px;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 20px;
    font-size: 22px;
    margin-top: 10px;
}

video {
    width: 100%;
    border-radius: 12px;
    background: black;
}

#depthLabel {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
}

</style>

</head>

<body>

<h1>NaverFoto</h1>

<input
    id="point"
    type="text"
    value="SK1"
    placeholder="Borepunkt">

<div id="depthLabel">
    0-1 m
</div>

<br>

<video
    id="camera"
    autoplay
    playsinline>
</video>

<button id="capture">
TA BILDE
</button>

<button id="back">
FORRIGE DYBDE
</button>

<button id="reset">
NYTT BOREPUNKT
</button>

<canvas
    id="canvas"
    style="display:none">
</canvas>

<script>

document.addEventListener("DOMContentLoaded", async () => {

    let currentDepth = 0;

    const pointInput =
        document.getElementById("point");

    const depthLabel =
        document.getElementById("depthLabel");

    const video =
        document.getElementById("camera");

    const canvas =
        document.getElementById("canvas");

    const captureBtn =
        document.getElementById("capture");

    const backBtn =
        document.getElementById("back");

    const resetBtn =
        document.getElementById("reset");

    function updateDepth() {
        depthLabel.textContent =
            `${currentDepth}-${currentDepth + 1} m`;
    }

    updateDepth();

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                }
            });

        video.srcObject = stream;

    }
    catch (error) {

        alert(
            "Kunne ikke åpne kamera. Kontroller kameratilgang."
        );

        console.error(error);
    }

    captureBtn.addEventListener("click", () => {

        const width = video.videoWidth;
        const height = video.videoHeight;

        if (!width || !height) {
            alert("Kamera er ikke klart ennå.");
            return;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx =
            canvas.getContext("2d");

        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );

        const borepunkt =
            pointInput.value.trim();

        const now =
            new Date();

        const dateText =
            now.toLocaleString("no-NO");

        ctx.fillStyle =
            "rgba(0,0,0,0.7)";

        ctx.fillRect(
            0,
            height - 180,
            width,
            180
        );

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 40px Arial";

        ctx.fillText(
            borepunkt,
            20,
            height - 120
        );

        ctx.fillText(
            `${currentDepth}-${currentDepth + 1} m`,
            20,
            height - 70
        );

        ctx.fillText(
            dateText,
            20,
            height - 20
        );

        const link =
            document.createElement("a");

        link.download =
            `${borepunkt}_${currentDepth}-${currentDepth + 1}m.jpg`;

        link.href =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );

        link.click();

        currentDepth++;

        updateDepth();
    });

    backBtn.addEventListener("click", () => {

        if (currentDepth > 0) {
            currentDepth--;
            updateDepth();
        }

    });

    resetBtn.addEventListener("click", () => {

        currentDepth = 0;

        updateDepth();

    });

});

</script>

</body>
</html>
