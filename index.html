<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>NaverFoto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        /*
         * Skrolling er tillatt dersom telefonens
         * skjerm er spesielt liten.
         */
        body {
            overflow-x: hidden;
            overflow-y: auto;
            background: #eeeeee;
            font-family: Arial, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            padding:
                max(5px, env(safe-area-inset-top))
                8px
                max(5px, env(safe-area-inset-bottom));
            gap: 5px;
        }

        h1 {
            flex: 0 0 auto;
            margin: 0;
            font-size: 21px;
            line-height: 26px;
            text-align: center;
        }

        #topRow {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 105px;
            align-items: end;
            flex: 0 0 auto;
            gap: 6px;
        }

        label {
            display: block;
            margin: 0 0 2px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 43px;
            padding: 5px 9px;
            border: 2px solid #555555;
            border-radius: 7px;
            background: white;
            font-size: 21px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #depthLabel {
            display: flex;
            height: 43px;
            align-items: center;
            justify-content: center;
            padding: 3px 6px;
            border: 2px solid #1769aa;
            border-radius: 7px;
            background: white;
            font-size: 21px;
            font-weight: bold;
            white-space: nowrap;
        }

        /*
         * Kameraet får en kontrollert høyde.
         * Dermed blir det plass til knappene.
         */
        #cameraArea {
            position: relative;
            width: 100%;
            height: clamp(175px, 37dvh, 330px);
            min-height: 175px;
            flex: 0 1 auto;
            overflow: hidden;
            border-radius: 9px;
            background: black;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            background: black;
            object-fit: contain;
        }

        #cameraStatus {
            position: absolute;
            left: 6px;
            bottom: 6px;
            max-width: calc(100% - 12px);
            padding: 3px 7px;
            border-radius: 4px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            font-size: 12px;
            pointer-events: none;
        }

        button {
            min-height: 46px;
            padding: 5px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #capture {
            width: 100%;
            min-height: 52px;
            flex: 0 0 auto;
            color: white;
            background: #1769aa;
            font-size: 21px;
        }

        /*
         * Knappene står ved siden av hverandre for
         * å spare høyde på mobilskjermen.
         */
        #depthButtons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 0 0 auto;
            gap: 6px;
        }

        #back {
            color: white;
            background: #555555;
        }

        #next {
            color: white;
            background: #2e7d32;
        }

        #reset {
            width: 100%;
            min-height: 42px;
            flex: 0 0 auto;
            color: #111111;
            background: #d0d0d0;
            font-size: 16px;
        }

        #status {
            min-height: 17px;
            overflow: hidden;
            flex: 0 0 auto;
            color: #333333;
            font-size: 12px;
            line-height: 17px;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #canvas {
            display: none;
        }

        /*
         * Ekstra kompakt oppsett på lave skjermer.
         */
        @media (max-height: 700px) {
            #app {
                gap: 4px;
                padding-top: 3px;
                padding-bottom: 3px;
            }

            h1 {
                font-size: 18px;
                line-height: 21px;
            }

            label {
                display: none;
            }

            input,
            #depthLabel {
                height: 39px;
            }

            #cameraArea {
                height: 32dvh;
                min-height: 145px;
            }

            button {
                min-height: 42px;
            }

            #capture {
                min-height: 46px;
            }

            #reset {
                min-height: 38px;
            }

            #status {
                display: none;
            }
        }

        /*
         * Svært smale telefoner får litt mindre
         * tekst på dybdeknappene.
         */
        @media (max-width: 370px) {
            #depthButtons button {
                font-size: 14px;
            }

            #topRow {
                grid-template-columns: minmax(0, 1fr) 92px;
            }

            #depthLabel {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <main id="app">
        <h1>NaverFoto</h1>

        <section id="topRow">
            <div>
                <label for="point">Borepunkt</label>

                <input
                    id="point"
                    type="text"
                    value="SK1"
                    placeholder="Borepunkt"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                >
            </div>

            <div
                id="depthLabel"
                aria-label="Gjeldende dybde"
            >
                0–1 m
            </div>
        </section>

        <section id="cameraArea">
            <video
                id="camera"
                autoplay
                muted
                playsinline
            ></video>

            <div id="cameraStatus">
                Starter bakkameraet …
            </div>
        </section>

        <button
            id="capture"
            type="button"
            disabled
        >
            TA BILDE
        </button>

        <section id="depthButtons">
            <button id="back" type="button">
                ◀ FORRIGE DYBDE
            </button>

            <button id="next" type="button">
                NESTE DYBDE ▶
            </button>
        </section>

        <button id="reset" type="button">
            NULLSTILL TIL 0–1 m
        </button>

        <div id="status">
            Gjør klar kameraet …
        </div>

        <canvas id="canvas"></canvas>
    </main>

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            async function () {
                "use strict";

                let currentDepth = 0;
                let cameraStream = null;
                let isSaving = false;

                const pointInput =
                    document.getElementById("point");

                const depthLabel =
                    document.getElementById("depthLabel");

                const video =
                    document.getElementById("camera");

                const canvas =
                    document.getElementById("canvas");

                const captureButton =
                    document.getElementById("capture");

                const backButton =
                    document.getElementById("back");

                const nextButton =
                    document.getElementById("next");

                const resetButton =
                    document.getElementById("reset");

                const status =
                    document.getElementById("status");

                const cameraStatus =
                    document.getElementById("cameraStatus");

                function getDepthText() {
                    return (
                        currentDepth +
                        "–" +
                        (currentDepth + 1) +
                        " m"
                    );
                }

                function updateDepth() {
                    depthLabel.textContent =
                        getDepthText();
                }

                /*
                 * Lager dato i norsk format:
                 * 23.10.2026
                 */
                function getDateText() {
                    const now = new Date();

                    const day = String(
                        now.getDate()
                    ).padStart(2, "0");

                    const month = String(
                        now.getMonth() + 1
                    ).padStart(2, "0");

                    const year =
                        now.getFullYear();

                    return (
                        day +
                        "." +
                        month +
                        "." +
                        year
                    );
                }

                /*
                 * Lager dato til filnavnet:
                 * 23-10-2026
                 */
                function getFileDate() {
                    return getDateText()
                        .replaceAll(".", "-");
                }

                function createSafeFileName(value) {
                    const cleanedName = value
                        .trim()
                        .toUpperCase()
                        .replace(
                            /[^A-ZÆØÅ0-9_-]/gi,
                            "_"
                        );

                    return cleanedName || "BOREPUNKT";
                }

                /*
                 * Tegner hvit tekst med svart omriss.
                 * Det brukes ingen bakgrunnsboks.
                 */
                function drawOutlinedText(
                    context,
                    text,
                    x,
                    y,
                    outlineWidth
                ) {
                    context.lineWidth =
                        outlineWidth;

                    context.lineJoin =
                        "round";

                    context.miterLimit = 2;

                    context.strokeStyle =
                        "rgba(0, 0, 0, 0.95)";

                    context.fillStyle =
                        "#ffffff";

                    context.strokeText(
                        text,
                        x,
                        y
                    );

                    context.fillText(
                        text,
                        x,
                        y
                    );
                }

                async function openCamera(
                    videoConstraints
                ) {
                    return navigator.mediaDevices
                        .getUserMedia({
                            video: videoConstraints,
                            audio: false
                        });
                }

                function stopCamera() {
                    if (!cameraStream) {
                        return;
                    }

                    cameraStream
                        .getTracks()
                        .forEach(function (track) {
                            track.stop();
                        });

                    cameraStream = null;
                }

                async function startBackCamera() {
                    if (
                        !navigator.mediaDevices ||
                        !navigator.mediaDevices.getUserMedia
                    ) {
                        cameraStatus.textContent =
                            "Nettleseren støtter ikke kamera.";

                        status.textContent =
                            "Åpne siden i Chrome via HTTPS.";

                        captureButton.disabled = true;
                        return;
                    }

                    stopCamera();

                    try {
                        /*
                         * Første forsøk krever bakkamera.
                         */
                        cameraStream =
                            await openCamera({
                                facingMode: {
                                    exact: "environment"
                                },

                                width: {
                                    ideal: 1920
                                },

                                height: {
                                    ideal: 1080
                                }
                            });
                    } catch (exactError) {
                        console.warn(
                            "Strengt valg av bakkamera feilet.",
                            exactError
                        );

                        try {
                            /*
                             * Reserveløsning for telefoner
                             * som ikke støtter exact.
                             */
                            cameraStream =
                                await openCamera({
                                    facingMode: {
                                        ideal: "environment"
                                    },

                                    width: {
                                        ideal: 1920
                                    },

                                    height: {
                                        ideal: 1080
                                    }
                                });
                        } catch (fallbackError) {
                            console.error(
                                "Kameraet kunne ikke åpnes.",
                                fallbackError
                            );

                            cameraStatus.textContent =
                                "Kameraet kunne ikke åpnes.";

                            status.textContent =
                                "Kontroller kameratillatelsen.";

                            captureButton.disabled = true;
                            return;
                        }
                    }

                    video.srcObject =
                        cameraStream;

                    try {
                        await video.play();

                        cameraStatus.textContent =
                            "Bakkamera klart";

                        status.textContent =
                            "Klar til å ta bilde.";

                        captureButton.disabled =
                            false;

                        setTimeout(function () {
                            if (cameraStream) {
                                cameraStatus.style.display =
                                    "none";
                            }
                        }, 1800);
                    } catch (playError) {
                        console.error(
                            "Kamerabildet kunne ikke startes.",
                            playError
                        );

                        cameraStatus.textContent =
                            "Kamerabildet kunne ikke startes.";

                        captureButton.disabled = true;
                    }
                }

                function takePhoto() {
                    if (isSaving) {
                        return;
                    }

                    const width =
                        video.videoWidth;

                    const height =
                        video.videoHeight;

                    if (!width || !height) {
                        alert(
                            "Kameraet er ikke klart ennå. " +
                            "Vent litt og prøv igjen."
                        );

                        return;
                    }

                    const borepunkt =
                        pointInput.value
                            .trim()
                            .toUpperCase();

                    if (!borepunkt) {
                        alert(
                            "Skriv inn borepunkt før du tar bildet."
                        );

                        pointInput.focus();
                        return;
                    }

                    /*
                     * Låser dybden som hører til bildet.
                     */
                    const fromDepth =
                        currentDepth;

                    const toDepth =
                        currentDepth + 1;

                    const intervalText =
                        fromDepth +
                        "–" +
                        toDepth +
                        " m";

                    const dateText =
                        getDateText();

                    canvas.width = width;
                    canvas.height = height;

                    const context =
                        canvas.getContext("2d");

                    if (!context) {
                        alert(
                            "Telefonen klarte ikke å behandle bildet."
                        );

                        return;
                    }

                    context.drawImage(
                        video,
                        0,
                        0,
                        width,
                        height
                    );

                    const fontSize = Math.max(
                        38,
                        Math.round(width * 0.042)
                    );

                    const leftMargin = Math.max(
                        22,
                        Math.round(width * 0.025)
                    );

                    const topMargin = Math.max(
                        28,
                        Math.round(height * 0.04)
                    );

                    const lineSpacing =
                        Math.round(fontSize * 1.35);

                    const outlineWidth = Math.max(
                        4,
                        Math.round(fontSize * 0.13)
                    );

                    context.font =
                        "bold " +
                        fontSize +
                        "px Arial, sans-serif";

                    context.textAlign = "left";
                    context.textBaseline = "top";

                    /*
                     * Kun tekst på venstre side:
                     * borepunkt, dybde og dato.
                     */
                    drawOutlinedText(
                        context,
                        borepunkt,
                        leftMargin,
                        topMargin,
                        outlineWidth
                    );

                    drawOutlinedText(
                        context,
                        intervalText,
                        leftMargin,
                        topMargin + lineSpacing,
                        outlineWidth
                    );

                    drawOutlinedText(
                        context,
                        dateText,
                        leftMargin,
                        topMargin + lineSpacing * 2,
                        outlineWidth
                    );

                    isSaving = true;
                    captureButton.disabled = true;
                    captureButton.textContent =
                        "LAGRER …";

                    status.textContent =
                        "Behandler bildet …";

                    canvas.toBlob(
                        function (blob) {
                            if (!blob) {
                                alert(
                                    "Bildet kunne ikke lagres."
                                );

                                isSaving = false;
                                captureButton.disabled = false;
                                captureButton.textContent =
                                    "TA BILDE";

                                status.textContent =
                                    "Lagringen mislyktes.";

                                return;
                            }

                            const fileName =
                                createSafeFileName(
                                    borepunkt
                                ) +
                                "_" +
                                fromDepth +
                                "-" +
                                toDepth +
                                "m_" +
                                getFileDate() +
                                ".jpg";

                            const imageUrl =
                                URL.createObjectURL(blob);

                            const downloadLink =
                                document.createElement("a");

                            downloadLink.href =
                                imageUrl;

                            downloadLink.download =
                                fileName;

                            document.body.appendChild(
                                downloadLink
                            );

                            downloadLink.click();
                            downloadLink.remove();

                            setTimeout(
                                function () {
                                    URL.revokeObjectURL(
                                        imageUrl
                                    );
                                },
                                2000
                            );

                            /*
                             * Går automatisk til neste dybde
                             * når bildet er lagret.
                             */
                            currentDepth += 1;
                            updateDepth();

                            isSaving = false;
                            captureButton.disabled = false;
                            captureButton.textContent =
                                "TA BILDE";

                            status.textContent =
                                "Lagret: " +
                                fileName;
                        },
                        "image/jpeg",
                        0.95
                    );
                }

                captureButton.addEventListener(
                    "click",
                    takePhoto
                );

                /*
                 * Går ett intervall tilbake.
                 */
                backButton.addEventListener(
                    "click",
                    function () {
                        if (currentDepth > 0) {
                            currentDepth -= 1;
                            updateDepth();

                            status.textContent =
                                "Valgt dybde: " +
                                getDepthText();
                        } else {
                            status.textContent =
                                "Dybden står allerede på 0–1 m.";
                        }
                    }
                );

                /*
                 * Ny knapp for å hoppe over en prøve.
                 * Det tas eller lagres ikke noe bilde.
                 */
                nextButton.addEventListener(
                    "click",
                    function () {
                        currentDepth += 1;
                        updateDepth();

                        status.textContent =
                            "Hoppet videre til " +
                            getDepthText();
                    }
                );

                resetButton.addEventListener(
                    "click",
                    function () {
                        currentDepth = 0;
                        updateDepth();

                        status.textContent =
                            "Dybden er nullstilt til 0–1 m.";
                    }
                );

                pointInput.addEventListener(
                    "input",
                    function () {
                        pointInput.value =
                            pointInput.value
                                .toUpperCase();
                    }
                );

                window.addEventListener(
                    "beforeunload",
                    stopCamera
                );

                updateDepth();
                await startBackCamera();
            }
        );
    </script>

</body>
</html>
