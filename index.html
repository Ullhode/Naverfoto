<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NaverFoto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            background: #eeeeee;
            font-family: Arial, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;

            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            min-height: 100dvh;

            margin: 0 auto;

            padding:
                max(5px, env(safe-area-inset-top))
                8px
                max(8px, env(safe-area-inset-bottom));

            gap: 5px;
        }

        h1 {
            flex: 0 0 auto;
            margin: 0;

            font-size: 21px;
            line-height: 25px;
            text-align: center;
        }

        /*
         * Prosjektnummer og borepunkt står på samme rad
         * for å bruke minst mulig plass på skjermen.
         */
        #inputRow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 0 0 auto;
            gap: 6px;
        }

        .inputGroup {
            min-width: 0;
        }

        label {
            display: block;
            margin: 0 0 2px;

            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 43px;

            padding: 5px 9px;

            border: 2px solid #555555;
            border-radius: 7px;

            background: white;

            font-size: 19px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /*
         * Dybden vises på en egen kompakt linje.
         */
        #depthRow {
            display: flex;
            align-items: center;
            justify-content: space-between;

            flex: 0 0 auto;

            min-height: 39px;
            padding: 3px 8px;

            border: 2px solid #1769aa;
            border-radius: 7px;

            background: white;
        }

        #depthTitle {
            font-size: 14px;
            font-weight: bold;
        }

        #depthLabel {
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        /*
         * Kameraet bruker mesteparten av tilgjengelig plass.
         * Siden kan skrolles dersom skjermen er lav.
         */
        #cameraArea {
            position: relative;

            width: 100%;
            min-height: 310px;

            flex: 1 1 430px;

            overflow: hidden;

            border-radius: 9px;
            background: black;
        }

        video {
            display: block;

            width: 100%;
            height: 100%;
            min-height: 310px;

            background: black;
            object-fit: contain;
        }

        #cameraStatus {
            position: absolute;

            left: 6px;
            bottom: 6px;

            max-width: calc(100% - 12px);

            padding: 3px 7px;

            border-radius: 4px;

            color: white;
            background: rgba(0, 0, 0, 0.55);

            font-size: 12px;

            pointer-events: none;
        }

        button {
            min-height: 43px;
            padding: 5px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            touch-action: manipulation;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #capture {
            width: 100%;
            min-height: 50px;

            flex: 0 0 auto;

            color: white;
            background: #1769aa;

            font-size: 21px;
        }

        #depthButtons {
            display: grid;
            grid-template-columns: 1fr 1fr;

            flex: 0 0 auto;
            gap: 6px;
        }

        #back {
            color: white;
            background: #555555;
        }

        #next {
            color: white;
            background: #2e7d32;
        }

        #reset {
            width: 100%;
            min-height: 40px;

            flex: 0 0 auto;

            color: #111111;
            background: #d0d0d0;

            font-size: 15px;
        }

        #status {
            min-height: 17px;

            flex: 0 0 auto;
            overflow: hidden;

            color: #333333;

            font-size: 12px;
            line-height: 17px;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #canvas {
            display: none;
        }

        /*
         * På lave skjermer beholdes et stort kamera.
         * Brukeren kan skrolle ned til knappene.
         */
        @media (max-height: 760px) {
            #app {
                min-height: 780px;
                gap: 4px;
            }

            h1 {
                font-size: 18px;
                line-height: 21px;
            }

            label {
                font-size: 11px;
            }

            input {
                height: 39px;
                font-size: 17px;
            }

            #depthRow {
                min-height: 36px;
            }

            #cameraArea,
            video {
                min-height: 310px;
            }

            #cameraArea {
                flex-basis: 310px;
            }

            #status {
                display: none;
            }
        }

        /*
         * Tilpasning for smale telefoner.
         */
        @media (max-width: 370px) {
            input {
                font-size: 16px;
            }

            #depthButtons button {
                font-size: 13px;
            }

            #depthTitle {
                font-size: 12px;
            }

            #depthLabel {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <main id="app">

        <h1>NaverFoto</h1>

        <section id="inputRow">

            <div class="inputGroup">
                <label for="project">
                    Prosjektnummer
                </label>

                <input
                    id="project"
                    type="text"
                    value=""
                    placeholder="F.eks. 12345"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                >
            </div>

            <div class="inputGroup">
                <label for="point">
                    Borepunkt
                </label>

                <input
                    id="point"
                    type="text"
                    value="SK1"
                    placeholder="F.eks. SK1"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                >
            </div>

        </section>

        <section id="depthRow">
            <span id="depthTitle">
                Valgt dybde
            </span>

            <span
                id="depthLabel"
                aria-label="Valgt dybde"
            >
                0–1 m
            </span>
        </section>

        <section id="cameraArea">

            <video
                id="camera"
                autoplay
                muted
                playsinline
            ></video>

            <div id="cameraStatus">
                Starter bakkameraet …
            </div>

        </section>

        <button
            id="capture"
            type="button"
            disabled
        >
            TA BILDE
        </button>

        <section id="depthButtons">

            <button
                id="back"
                type="button"
            >
                ◀ FORRIGE
            </button>

            <button
                id="next"
                type="button"
            >
                NESTE ▶
            </button>

        </section>

        <button
            id="reset"
            type="button"
        >
            NULLSTILL TIL 0–1 m
        </button>

        <div
            id="status"
            role="status"
            aria-live="polite"
        >
            Gjør klar kameraet …
        </div>

        <canvas id="canvas"></canvas>

    </main>

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            async function () {
                "use strict";

                let currentDepth = 0;
                let cameraStream = null;
                let isSaving = false;

                const projectInput =
                    document.getElementById("project");

                const pointInput =
                    document.getElementById("point");

                const depthLabel =
                    document.getElementById("depthLabel");

                const video =
                    document.getElementById("camera");

                const canvas =
                    document.getElementById("canvas");

                const captureButton =
                    document.getElementById("capture");

                const backButton =
                    document.getElementById("back");

                const nextButton =
                    document.getElementById("next");

                const resetButton =
                    document.getElementById("reset");

                const status =
                    document.getElementById("status");

                const cameraStatus =
                    document.getElementById("cameraStatus");

                /*
                 * Henter eventuelle lagrede feltverdier.
                 * Dette gjør at prosjekt og borepunkt huskes
                 * neste gang appen åpnes.
                 */
                function loadSavedValues() {
                    try {
                        const savedProject =
                            localStorage.getItem(
                                "naverfotoProject"
                            );

                        const savedPoint =
                            localStorage.getItem(
                                "naverfotoPoint"
                            );

                        if (savedProject) {
                            projectInput.value =
                                savedProject;
                        }

                        if (savedPoint) {
                            pointInput.value =
                                savedPoint;
                        }
                    } catch (error) {
                        console.warn(
                            "Kunne ikke hente lagrede verdier.",
                            error
                        );
                    }
                }

                /*
                 * Lagrer prosjekt og borepunkt på telefonen.
                 */
                function saveInputValues() {
                    try {
                        localStorage.setItem(
                            "naverfotoProject",
                            projectInput.value
                        );

                        localStorage.setItem(
                            "naverfotoPoint",
                            pointInput.value
                        );
                    } catch (error) {
                        console.warn(
                            "Kunne ikke lagre feltverdiene.",
                            error
                        );
                    }
                }

                function getDepthText() {
                    return (
                        currentDepth +
                        "–" +
                        (currentDepth + 1) +
                        " m"
                    );
                }

                function updateDepth() {
                    depthLabel.textContent =
                        getDepthText();
                }

                /*
                 * Dato på bildet:
                 * 26.10.2026
                 */
                function getDateText() {
                    const now =
                        new Date();

                    const day =
                        String(now.getDate())
                            .padStart(2, "0");

                    const month =
                        String(now.getMonth() + 1)
                            .padStart(2, "0");

                    const year =
                        now.getFullYear();

                    return (
                        day +
                        "." +
                        month +
                        "." +
                        year
                    );
                }

                /*
                 * Dato i filnavnet:
                 * 26-10-2026
                 */
                function getFileDate() {
                    return getDateText()
                        .replaceAll(".", "-");
                }

                /*
                 * Fjerner tegn som ikke passer i filnavn.
                 */
                function createSafeFileName(
                    value,
                    fallback
                ) {
                    const cleanedName =
                        value
                            .trim()
                            .toUpperCase()
                            .replace(
                                /[^A-ZÆØÅ0-9_-]/gi,
                                "_"
                            )
                            .replace(
                                /_+/g,
                                "_"
                            );

                    return cleanedName || fallback;
                }

                /*
                 * Tegner hvit tekst med svart omriss.
                 * Det brukes ingen bakgrunnsboks.
                 */
                function drawOutlinedText(
                    context,
                    text,
                    x,
                    y,
                    outlineWidth
                ) {
                    context.lineWidth =
                        outlineWidth;

                    context.lineJoin =
                        "round";

                    context.miterLimit = 2;

                    context.strokeStyle =
                        "rgba(0, 0, 0, 0.95)";

                    context.fillStyle =
                        "#ffffff";

                    context.strokeText(
                        text,
                        x,
                        y
                    );

                    context.fillText(
                        text,
                        x,
                        y
                    );
                }

                async function openCamera(
                    videoConstraints
                ) {
                    return navigator.mediaDevices
                        .getUserMedia({
                            video: videoConstraints,
                            audio: false
                        });
                }

                function stopCamera() {
                    if (!cameraStream) {
                        return;
                    }

                    cameraStream
                        .getTracks()
                        .forEach(function (track) {
                            track.stop();
                        });

                    cameraStream = null;
                }

                /*
                 * Starter telefonens bakkamera.
                 */
                async function startBackCamera() {
                    if (
                        !navigator.mediaDevices ||
                        !navigator.mediaDevices.getUserMedia
                    ) {
                        cameraStatus.textContent =
                            "Nettleseren støtter ikke kamera.";

                        status.textContent =
                            "Åpne siden i Chrome via HTTPS.";

                        captureButton.disabled = true;
                        return;
                    }

                    stopCamera();

                    try {
                        /*
                         * Første forsøk krever bakkamera.
                         */
                        cameraStream =
                            await openCamera({
                                facingMode: {
                                    exact: "environment"
                                },

                                width: {
                                    ideal: 1920
                                },

                                height: {
                                    ideal: 1080
                                }
                            });

                    } catch (exactError) {
                        console.warn(
                            "Strengt valg av bakkamera feilet.",
                            exactError
                        );

                        try {
                            /*
                             * Reserveløsning for telefoner
                             * som ikke støtter exact.
                             */
                            cameraStream =
                                await openCamera({
                                    facingMode: {
                                        ideal: "environment"
                                    },

                                    width: {
                                        ideal: 1920
                                    },

                                    height: {
                                        ideal: 1080
                                    }
                                });

                        } catch (fallbackError) {
                            console.error(
                                "Kameraet kunne ikke åpnes.",
                                fallbackError
                            );

                            cameraStatus.textContent =
                                "Kameraet kunne ikke åpnes.";

                            status.textContent =
                                "Kontroller kameratillatelsen.";

                            captureButton.disabled = true;
                            return;
                        }
                    }

                    video.srcObject =
                        cameraStream;

                    try {
                        await video.play();

                        cameraStatus.textContent =
                            "Bakkamera klart";

                        status.textContent =
                            "Klar til å ta bilde.";

                        captureButton.disabled =
                            false;

                        setTimeout(
                            function () {
                                if (cameraStream) {
                                    cameraStatus.style.display =
                                        "none";
                                }
                            },
                            1800
                        );

                    } catch (playError) {
                        console.error(
                            "Kamerabildet kunne ikke startes.",
                            playError
                        );

                        cameraStatus.textContent =
                            "Kamerabildet kunne ikke startes.";

                        captureButton.disabled =
                            true;
                    }
                }

                /*
                 * Tar bilde, legger på teksten og
                 * lagrer bildet på telefonen.
                 */
                function takePhoto() {
                    if (isSaving) {
                        return;
                    }

                    const width =
                        video.videoWidth;

                    const height =
                        video.videoHeight;

                    if (!width || !height) {
                        alert(
                            "Kameraet er ikke klart ennå. " +
                            "Vent litt og prøv igjen."
                        );

                        return;
                    }

                    const projectNumber =
                        projectInput.value
                            .trim()
                            .toUpperCase();

                    const borepunkt =
                        pointInput.value
                            .trim()
                            .toUpperCase();

                    if (!projectNumber) {
                        alert(
                            "Skriv inn prosjektnummer før du tar bildet."
                        );

                        projectInput.focus();
                        return;
                    }

                    if (!borepunkt) {
                        alert(
                            "Skriv inn borepunkt før du tar bildet."
                        );

                        pointInput.focus();
                        return;
                    }

                    /*
                     * Låser verdiene som hører til bildet.
                     */
                    const fromDepth =
                        currentDepth;

                    const toDepth =
                        currentDepth + 1;

                    const projectText =
                        "Prosjekt: " +
                        projectNumber;

                    const pointText =
                        "Borepunkt: " +
                        borepunkt;

                    const intervalText =
                        "Dybde: " +
                        fromDepth +
                        "–" +
                        toDepth +
                        " m";

                    const dateText =
                        getDateText();

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const context =
                        canvas.getContext("2d");

                    if (!context) {
                        alert(
                            "Telefonen klarte ikke å behandle bildet."
                        );

                        return;
                    }

                    context.drawImage(
                        video,
                        0,
                        0,
                        width,
                        height
                    );

                    /*
                     * Tekststørrelsen tilpasses
                     * oppløsningen på bildet.
                     */
                    const fontSize =
                        Math.max(
                            34,
                            Math.round(width * 0.038)
                        );

                    const leftMargin =
                        Math.max(
                            22,
                            Math.round(width * 0.025)
                        );

                    const topMargin =
                        Math.max(
                            28,
                            Math.round(height * 0.04)
                        );

                    const lineSpacing =
                        Math.round(fontSize * 1.32);

                    const outlineWidth =
                        Math.max(
                            4,
                            Math.round(fontSize * 0.13)
                        );

                    context.font =
                        "bold " +
                        fontSize +
                        "px Arial, sans-serif";

                    context.textAlign =
                        "left";

                    context.textBaseline =
                        "top";

                    /*
                     * Teksten står øverst på venstre side.
                     * Ingen grå eller svart bakgrunnsboks.
                     */
                    drawOutlinedText(
                        context,
                        projectText,
                        leftMargin,
                        topMargin,
                        outlineWidth
                    );

                    drawOutlinedText(
                        context,
                        pointText,
                        leftMargin,
                        topMargin + lineSpacing,
                        outlineWidth
                    );

                    drawOutlinedText(
                        context,
                        intervalText,
                        leftMargin,
                        topMargin + lineSpacing * 2,
                        outlineWidth
                    );

                    drawOutlinedText(
                        context,
                        dateText,
                        leftMargin,
                        topMargin + lineSpacing * 3,
                        outlineWidth
                    );

                    isSaving = true;

                    captureButton.disabled =
                        true;

                    captureButton.textContent =
                        "LAGRER …";

                    status.textContent =
                        "Behandler bildet …";

                    /*
                     * Gjør canvas-bildet om til en JPEG-fil.
                     */
                    canvas.toBlob(
                        function (blob) {
                            if (!blob) {
                                alert(
                                    "Bildet kunne ikke lagres."
                                );

                                isSaving = false;

                                captureButton.disabled =
                                    false;

                                captureButton.textContent =
                                    "TA BILDE";

                                status.textContent =
                                    "Lagringen mislyktes.";

                                return;
                            }

                            const safeProject =
                                createSafeFileName(
                                    projectNumber,
                                    "PROSJEKT"
                                );

                            const safePoint =
                                createSafeFileName(
                                    borepunkt,
                                    "BOREPUNKT"
                                );

                            const fileName =
                                safeProject +
                                "_" +
                                safePoint +
                                "_" +
                                fromDepth +
                                "-" +
                                toDepth +
                                "m_" +
                                getFileDate() +
                                ".jpg";

                            const imageUrl =
                                URL.createObjectURL(blob);

                            const downloadLink =
                                document.createElement("a");

                            downloadLink.href =
                                imageUrl;

                            downloadLink.download =
                                fileName;

                            document.body.appendChild(
                                downloadLink
                            );

                            downloadLink.click();
                            downloadLink.remove();

                            setTimeout(
                                function () {
                                    URL.revokeObjectURL(
                                        imageUrl
                                    );
                                },
                                2000
                            );

                            /*
                             * Går automatisk til neste dybde
                             * når bildet er ferdig lagret.
                             */
                            currentDepth += 1;
                            updateDepth();

                            isSaving = false;

                            captureButton.disabled =
                                false;

                            captureButton.textContent =
                                "TA BILDE";

                            status.textContent =
                                "Lagret: " +
                                fileName;
                        },
                        "image/jpeg",
                        0.95
                    );
                }

                captureButton.addEventListener(
                    "click",
                    takePhoto
                );

                /*
                 * Flytter ett intervall tilbake.
                 */
                backButton.addEventListener(
                    "click",
                    function () {
                        if (currentDepth > 0) {
                            currentDepth -= 1;
                            updateDepth();

                            status.textContent =
                                "Valgt dybde: " +
                                getDepthText();
                        } else {
                            status.textContent =
                                "Dybden står allerede på 0–1 m.";
                        }
                    }
                );

                /*
                 * Hopper over en prøve uten
                 * å ta eller lagre et bilde.
                 */
                nextButton.addEventListener(
                    "click",
                    function () {
                        currentDepth += 1;
                        updateDepth();

                        status.textContent =
                            "Valgt dybde: " +
                            getDepthText();
                    }
                );

                /*
                 * Nullstiller dybden.
                 */
                resetButton.addEventListener(
                    "click",
                    function () {
                        currentDepth = 0;
                        updateDepth();

                        status.textContent =
                            "Dybden er nullstilt til 0–1 m.";
                    }
                );

                /*
                 * Gjør prosjektnummeret automatisk
                 * til store bokstaver og husker verdien.
                 */
                projectInput.addEventListener(
                    "input",
                    function () {
                        projectInput.value =
                            projectInput.value
                                .toUpperCase();

                        saveInputValues();
                    }
                );

                /*
                 * Gjør borepunktet automatisk
                 * til store bokstaver og husker verdien.
                 */
                pointInput.addEventListener(
                    "input",
                    function () {
                        pointInput.value =
                            pointInput.value
                                .toUpperCase();

                        saveInputValues();
                    }
                );

                window.addEventListener(
                    "beforeunload",
                    stopCamera
                );

                loadSavedValues();
                updateDepth();
                await startBackCamera();
            }
        );
    </script>

</body>
</html>
